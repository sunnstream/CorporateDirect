# .github/workflows/purge-jsdelivr.yml
name: Purge jsDelivr cache

on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge file
        run: curl -s "https://purge.jsdelivr.net/gh/sunnstream/CorporateDirect@main/form-scripts.js"
      - name: Purge branch pointer
        run: curl -s "https://purge.jsdelivr.net/gh/sunnstream/CorporateDirect"
